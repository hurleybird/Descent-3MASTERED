name: Windows release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and validate release package
        shell: powershell
        run: ./tools/package-windows-release.ps1

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Descent-3MASTERED-Windows-x64
          path: |
            out/release/*.zip
            out/release/*.sha256
          if-no-files-found: error

      - name: Upload exact-package contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-renderer-contracts-${{ github.sha }}
          path: |
            out/release-work/x64/renderer-contract-identity.json
            out/release-work/x64/CMakeCache.txt
            out/release-work/x64/CMakeFiles/**/CMakeCXXCompiler.cmake
            out/release-work/x64/Testing/Temporary/*.log
          if-no-files-found: warn
